name: Crear APK de Mini Yo Tamagotchi

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Buscar y descomprimir proyecto
        run: |
          echo "Archivos del repositorio:"
          ls -lah

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir proyecto
          unzip -q "$ZIP" -d proyecto

          echo "Contenido descomprimido:"
          find proyecto -maxdepth 3 -type f | head -50

          cp -a proyecto/MiniYoTamagotchiAndroid/. .
          rm -rf proyecto

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Compilar APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniYoTamagotchi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
